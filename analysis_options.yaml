include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: false

analyzer:
  exclude:
    - lib/**/*_20260630_*.dart
    - lib/features/discover/compose_post_page.dart
    - lib/features/groups/**
    - lib/features/match/**
    - lib/features/plaza/**
    - lib/features/profile/personality_test_page.dart
    - lib/features/profile/rewards_page.dart
  errors:
    use_build_context_synchronously: ignore
