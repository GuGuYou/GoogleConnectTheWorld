name: gobuzz
description: "GoBuzz — LBS + IP 标签兴趣社交 App（Cyber Neon 风格）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.7

  # 国际化辅助
  intl: ^0.20.2

  # 地图
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.2

  # 动效
  flutter_animate: ^4.5.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # 卡片滑动
  flutter_card_swiper: ^7.0.2

  # 本地存储
  shared_preferences: ^2.3.2

  # 图片选择
  image_picker: ^1.1.2

  # 网络请求（调用自建 AI 生成后端）
  http: ^1.2.2

  # 加密 / 哈希（匿名身份 + 日志脱敏）
  crypto: ^3.0.6
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

# Native launch screen — dark honeycomb bg + white-disc bee, matching the
# Flutter SplashPage so the hand-off doesn't flash. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#100E0C"
  image: assets/icon/splash_bee.png
  android_12:
    image: assets/icon/splash_bee.png
    color: "#100E0C"
  android: true
  ios: true
  web: false

# App launcher icon — GoBuzz bee (assets/icon/*). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#100E0C"
    theme_color: "#FFC000"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/banners/
    - assets/images/icons/
    - assets/images/decorations/
    - assets/images/branding/
    - assets/images/splash/
    - assets/images/onboarding/
    - assets/images/avatars/
    - assets/images/avatars/parts/
    - assets/images/placeholders/
    - assets/data/
    - assets/avatars/
    - secrets/google_maps_api_key.json

  fonts:
    # TikTok Sans (variable: wght 300-900, opsz, wdth, slnt). Brand display
    # font from the Figma redesign. OFL-licensed — see TikTokSans-OFL.txt.
    - family: TikTok Sans
      fonts:
        - asset: assets/fonts/TikTokSans.ttf
