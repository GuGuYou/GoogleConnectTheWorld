name: gobuzz
description: "GoBuzz — LBS + IP 标签兴趣社交 App（Cyber Neon 风格）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.7

  # 国际化辅助
  intl: ^0.20.2

  # 地图
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.2

  # 动效
  flutter_animate: ^4.5.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # 卡片滑动
  flutter_card_swiper: ^7.0.2

  # 本地存储
  shared_preferences: ^2.3.2

  # 图片选择
  image_picker: ^1.1.2

  # 网络请求（调用自建 AI 生成后端）
  http: ^1.2.2

  # 加密 / 哈希（匿名身份 + 日志脱敏）
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/avatars/
    - secrets/google_maps_api_key.json
